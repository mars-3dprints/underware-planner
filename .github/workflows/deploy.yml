name: Deploy to GitHub Pages

# Deploys a release to GitHub Pages. Called by the Release workflow for each new release;
# run it by hand to redeploy the latest release.
on:
  workflow_call:
    inputs:
      ref:
        description: Release tag to deploy
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: ref
        name: Pick the release to deploy
        run: echo "ref=${INPUT_REF:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}" >>"$GITHUB_OUTPUT"
        env:
          INPUT_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One deployment at a time; a newer one waits rather than cancelling one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
