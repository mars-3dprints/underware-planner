name: Feature request
description: Suggest a part, tool or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The setup or task this would help with. For a new part, link the openGrid or Underware model if there is one.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Sketches and screenshots are welcome.
